name: Build manuscript derivatives
on:
  push:
    branches: [preprint-integrity-review-20261121]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manuscript-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tooling
        run: |
          python -m pip install pandas python-docx pillow
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Rebuild Word and PDF documents from source Markdown
        run: |
          python scripts/03_build_documents.py
          libreoffice -env:UserInstallation=file:///tmp/lo-research-build --headless --convert-to pdf --outdir manuscript manuscript/audience_calibrated_medical_safety_manuscript.docx manuscript/audience_calibrated_medical_safety_medrxiv.docx manuscript/audience_calibrated_medical_safety_JAMIA.docx manuscript/audience_calibrated_medical_safety_supplement.docx
          libreoffice -env:UserInstallation=file:///tmp/lo-ethics-build --headless --convert-to pdf --outdir . ETHICS_SELF_ASSESSMENT.docx
          cp manuscript/audience_calibrated_medical_safety_manuscript.pdf PAPER.pdf
          cp manuscript/audience_calibrated_medical_safety_supplement.pdf SUPPLEMENT.pdf
          test -s PAPER.pdf
          test -s ETHICS_SELF_ASSESSMENT.pdf
          test -s manuscript/audience_calibrated_medical_safety_JAMIA.pdf
          pdftotext PAPER.pdf - | grep -q 'Evaluator specification'
      - name: Commit refreshed derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAPER.pdf SUPPLEMENT.pdf ETHICS_SELF_ASSESSMENT.docx ETHICS_SELF_ASSESSMENT.pdf manuscript/*.docx manuscript/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild manuscript, supplement and ethics derivatives from audited sources"
            git push origin HEAD:${{ github.ref_name }}
          fi
