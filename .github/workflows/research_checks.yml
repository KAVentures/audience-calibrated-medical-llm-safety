name: Research source checks
on:
  push:
    branches: [main, preprint-integrity-review-20261121]
  pull_request:
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_research_integrity.py
      - run: python scripts/check_document_map.py
      - run: python scripts/check_arxiv_readiness.py
      - run: python -m py_compile scripts/03_build_documents.py scripts/check_arxiv_readiness.py scripts/build_arxiv_release_manifest.py
